<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earthquake 2023</title>
<style>
  @font-face { font-family: "Bebas Neue"; font-weight: 400; src: url(assets/fonts/bebas-neue-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 400; src: url(assets/fonts/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 600; src: url(assets/fonts/inter-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 700; src: url(assets/fonts/inter-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 800; src: url(assets/fonts/inter-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 900; src: url(assets/fonts/inter-latin-900-normal.woff2) format("woff2"); }
  @font-face { font-family: "Playfair Display"; font-style: italic; font-weight: 400; src: url(assets/fonts/playfair-display-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "Playfair Display"; font-style: italic; font-weight: 700; src: url(assets/fonts/playfair-display-latin-700-italic.woff2) format("woff2"); }
  @font-face { font-family: "Playfair Display"; font-weight: 700; src: url(assets/fonts/playfair-display-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Playfair Display"; font-weight: 800; src: url(assets/fonts/playfair-display-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(assets/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(assets/fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #gl { display: block; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  #loading { position: absolute; left: 24px; bottom: 20px; color: #777; font: 14px Inter, Arial, sans-serif; }
  #time { position: absolute; right: 12px; bottom: 8px; color: rgba(255,255,255,0.25); font: 12px "JetBrains Mono", monospace; }
  body.render #time { display: none; }
  body.render, body.render html { width: 1920px; height: 1080px; }
  body.render #gl { width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div id="loading">loading…</div>
<div id="time"></div>
<script>if (location.search.indexOf('render') >= 0) document.body.className = 'render';</script>
<script src="dist/app.js"></script>
</body>
</html>
